services:
  web:
    build: .
    container_name: saiga-web
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: saiga-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  caddy_data:
